<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>

    <!--CSS Stylesheet-->
    <link rel="stylesheet" href="style.css" />

    <!--Box icons link-->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="profile-card">
      <div class="image">
        <img src="images.jpg" alt="My profile picture" class="profile-img" />
      </div>

      <div class="text-data">
        <span class="name">MasterNova</span>
        <span class="job">Student & Developer</span>
      </div>

      <div class="media-buttons">
        <a
          href="https://www.youtube.com/channel/UCSvSmi-lO6Xgli0Mbd4Gojg"
          style="background: #ff0033"
          class="link"
          target="_blank"
        >
          <i class="bx bxl-youtube"></i>
        </a>
        <a
          href="https://www.instagram.com/ravi_account/"
          style="background: linear-gradient(#f9ce34, #ee2a7b, #6228d7)"
          class="link"
          target="_blank"
        >
          <i class="bx bxl-instagram"></i>
        </a>
        <a
          href="https://github.com/Masternovaa"
          style="background: rgb(22, 22, 22)"
          class="link"
          target="_blank"
        >
          <i class="bx bxl-github"></i>
        </a>
        <a
          href="https://www.tiktok.com/@ravi_or_nova?_r=1&_t=ZS-9AEjLstmFSW"
          style="background: rgb(22, 22, 22)"
          class="link"
          target="_blank"
        >
          <i class="bx bxl-tiktok"></i>
        </a>
      </div>

      <div class="buttons">
        <a
          href="https://www.youtube.com/channel/UCSvSmi-lO6Xgli0Mbd4Gojg"
          target="_blank"
        >
          <button class="button">Subscribe</button>
        </a>
        <a href="https://www.instagram.com/ravi_account/" target="_blank">
          <button class="button">Message</button>
        </a>
      </div>
    </div>
  </body>
</html>
